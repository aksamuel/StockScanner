<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in | StockScanner</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e0e0e0; background: #0f1923; }
    main { width: min(100%, 420px); padding: 30px; border: 1px solid #263d50; border-radius: 12px; background: #1a2a3a; box-shadow: 0 18px 50px #0006; }
    h1 { margin: 0 0 6px; color: #4fc3f7; font-size: 1.7rem; }
    .subtitle { margin: 0 0 24px; color: #90a4ae; }
    label { display: block; margin: 14px 0 6px; font-size: .9rem; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #3b5368; border-radius: 6px; color: #fff; background: #0f1923; font: inherit; }
    input:focus { outline: 2px solid #4fc3f7; outline-offset: 1px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    button { padding: 11px 14px; border: 1px solid #4fc3f7; border-radius: 6px; color: #10242d; background: #4fc3f7; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { color: #4fc3f7; background: transparent; }
    button:disabled { cursor: wait; opacity: .65; }
    #message { min-height: 24px; margin: 16px 0 0; color: #ffcc80; font-size: .9rem; }
    #message.success { color: #a5d6a7; }
  </style>
</head>
<body>
  <main>
    <h1>StockScanner</h1>
    <p class="subtitle">Sign in to view the dashboard.</p>
    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
      <div class="actions">
        <button id="signIn" type="submit">Sign in</button>
        <button id="signUp" class="secondary" type="button">Create account</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/+esm";

    const APP_ROOT = "/StockScanner/";
    const supabase = createClient(
      "https://cszzbkssxxgwgafwuonc.supabase.co",
      "sb_publishable_VnhkG4H4acjm2Hp1k5tzyw_I9xtUrGI",
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } },
    );
    const form = document.querySelector("#authForm");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const signIn = document.querySelector("#signIn");
    const signUp = document.querySelector("#signUp");
    const message = document.querySelector("#message");

    function destination() {
      const value = new URLSearchParams(window.location.search).get("next");
      if (!value || !value.startsWith(APP_ROOT) || value.startsWith(`${APP_ROOT}login.html`)) return `${APP_ROOT}index.html`;
      return value;
    }

    function setBusy(busy) {
      signIn.disabled = busy;
      signUp.disabled = busy;
    }

    function setMessage(text, success = false) {
      message.textContent = text;
      message.classList.toggle("success", success);
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.replace(destination());

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setBusy(true);
      setMessage("Signing in...");
      const { error } = await supabase.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
      setBusy(false);
      if (error) return setMessage(error.message);
      window.location.replace(destination());
    });

    signUp.addEventListener("click", async () => {
      if (!form.reportValidity()) return;
      setBusy(true);
      setMessage("Creating account...");
      const { data, error } = await supabase.auth.signUp({
        email: email.value.trim(),
        password: password.value,
        options: { emailRedirectTo: `${window.location.origin}${APP_ROOT}login.html` },
      });
      setBusy(false);
      if (error) return setMessage(error.message);
      if (data.session) return window.location.replace(destination());
      setMessage("Account created. Check your email to confirm your address, then sign in.", true);
    });
  </script>
</body>
</html>
