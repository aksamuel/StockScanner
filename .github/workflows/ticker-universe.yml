name: Daily NYSE Ticker Universe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ticker-universe.yml"
      - "stockscanner/ticker_universe_store.py"
      - "stockscanner/universe.py"
      - "supabase/migrations/**"
  # GitHub cron is UTC-only. Running at both candidate UTC hours and applying
  # New York/date guards in Python produces one refresh at 08:07 through DST.
  # Minute 7 avoids GitHub Actions' busiest top-of-hour scheduling window.
  schedule:
    - cron: "7 12,13 * * 1-5"

permissions:
  actions: write
  contents: read

concurrency:
  group: "nyse-ticker-universe"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Test ticker-universe storage
        run: pytest -q tests/test_ticker_universe_store.py

      - name: Replace the current Supabase ticker universe
        id: refresh
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" != "schedule" ]; then
            FORCE_FLAG="--force"
          fi
          python -m stockscanner.ticker_universe_store \
            $FORCE_FLAG \
            --github-output "$GITHUB_OUTPUT"

      - name: Trigger full scanner after successful ticker refresh
        if: steps.refresh.outputs.stored == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gh workflow run scan.yml --ref main -f mode=universe; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to dispatch the scanner after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
