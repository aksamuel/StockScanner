name: Hourly Price Snapshot

on:
  workflow_dispatch:
  # A workflow/code change performs one immediate, market-hours catch-up.
  push:
    branches: [main]
    paths:
      - ".github/workflows/price-snapshot.yml"
      - "stockscanner/price_snapshot.py"
      - "stockscanner/supabase_snapshot.py"
  # Covers 09:47-16:47 New York in both EST and EDT. The Python script
  # performs the authoritative 09:30-16:00 America/New_York runtime gate.
  schedule:
    - cron: "47 13-21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

# Share the full scanner's Pages lock so report and snapshot deployments cannot
# overlap or publish artifacts built from conflicting repository revisions.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    outputs:
      snapshot_changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Test snapshot code
        run: pytest -q tests/test_price_snapshot.py tests/test_supabase_snapshot.py

      - name: Refresh prices through free provider failover
        id: refresh
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python -m stockscanner.price_snapshot
          if git diff --quiet -- prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Store snapshot in Supabase
        if: steps.refresh.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m stockscanner.supabase_snapshot --input prices.json

      - name: Commit snapshot only when changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No in-session snapshot changes to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "Update hourly price snapshot"
            git push
          fi

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v3

      - name: Upload site artifact for Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: refresh
    if: needs.refresh.outputs.snapshot_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
