name: Hourly Price Snapshot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Price collection mode"
        type: choice
        options: [auto, hourly, close]
        default: auto
  push:
    branches: [main]
    paths:
      - ".github/workflows/price-snapshot.yml"
      - "stockscanner/price_snapshot.py"
      - "stockscanner/price_schedule.py"
      - "stockscanner/snapshot_health.py"
      - "stockscanner/display_time.py"
      - "stockscanner/price_providers.py"
      - "stockscanner/market_data.py"
      - "stockscanner/portfolio_symbols.py"
      - "stockscanner/supabase_snapshot.py"
      - "stockscanner/price_run_state.py"
      - "stockscanner/failed_symbol_store.py"
      - "supabase/migrations/**"
  # Frequent New York attempts recover from delayed or dropped scheduled
  # events. Supabase leases permit only one completed collection per due slot.
  schedule:
    - cron: "7,22,37,52 8-19 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  issues: write

concurrency:
  group: "hourly-price-snapshot"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve New York collection window
        id: window
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python -m stockscanner.price_schedule --mode "$REQUESTED_MODE" --github-output "$GITHUB_OUTPUT"

      - name: Acquire collection slot
        id: lease
        if: steps.window.outputs.valid == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m stockscanner.price_run_state acquire \
            --slot "${{ steps.window.outputs.slot }}" \
            --market-date "${{ steps.window.outputs.market_date }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        if: steps.lease.outputs.acquired == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.lease.outputs.acquired == 'true'
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Test snapshot code
        if: steps.lease.outputs.acquired == 'true'
        run: pytest -q tests/test_price_snapshot.py tests/test_price_schedule.py tests/test_price_run_state.py tests/test_portfolio_symbols.py tests/test_supabase_snapshot.py

      - name: Download current singleton from Supabase
        if: steps.lease.outputs.acquired == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if ! python -m stockscanner.supabase_snapshot --download "$RUNNER_TEMP/prices.json"; then
            echo "Bootstrapping an uninitialized singleton from the repository."
            cp prices.json "$RUNNER_TEMP/prices.json"
          fi

      - name: Load unresolved prior-market-day tickers for retry
        if: steps.lease.outputs.acquired == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m stockscanner.failed_symbol_store \
            --scan-type hourly \
            --before-market-date "${{ steps.window.outputs.market_date }}" \
            --output "$RUNNER_TEMP/retry-symbols.json"

      - name: Refresh prices through free provider failover
        id: collect
        if: steps.lease.outputs.acquired == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python -m stockscanner.price_snapshot \
            --output "$RUNNER_TEMP/prices.json" \
            --failed-symbols-output "$RUNNER_TEMP/hourly-failed-symbols.json" \
            --retry-symbols-file "$RUNNER_TEMP/retry-symbols.json" \
            --mode "${{ steps.window.outputs.mode }}"

      - name: Store hourly failed-symbol scan record
        if: always() && steps.lease.outputs.acquired == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ ! -f "$RUNNER_TEMP/hourly-failed-symbols.json" ]; then
            echo "Price refresh did not produce failure metadata; refusing to record an empty scan." >&2
            exit 1
          fi
          python -m stockscanner.failed_symbol_store "$RUNNER_TEMP/hourly-failed-symbols.json" \
            --scan-type hourly \
            --workflow-run-id "${{ github.run_id }}"

      - name: Store singleton in Supabase
        if: steps.lease.outputs.acquired == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m stockscanner.supabase_snapshot --input "$RUNNER_TEMP/prices.json"

      - name: Read purchased-stock coverage
        id: coverage
        if: steps.lease.outputs.acquired == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "prices.json").read_text())
          missing = payload.get("portfolio_missing_symbols", [])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"complete={str(not missing).lower()}\n")
              output.write(f"missing_count={len(missing)}\n")
              output.write(f"missing_symbols={','.join(missing)}\n")
          PY

      - name: Check snapshot freshness and provider fallback
        id: health
        if: steps.lease.outputs.acquired == 'true'
        run: python -m stockscanner.snapshot_health --input "$RUNNER_TEMP/prices.json" --max-age-minutes 75 --github-output "$GITHUB_OUTPUT"

      - name: Report stale stored snapshot
        if: steps.health.outputs.fresh == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_MINUTES: ${{ steps.health.outputs.age_minutes }}
        run: |
          TITLE="Hourly market snapshot is stale"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          BODY="The stored snapshot is ${AGE_MINUTES} minutes old after a recovery attempt. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1

      - name: Close recovered snapshot freshness issue
        if: steps.health.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Hourly market snapshot is stale"
          gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | \
          while read -r ISSUE_NUMBER; do
            [ -z "$ISSUE_NUMBER" ] || gh issue close "$ISSUE_NUMBER" --comment "The hourly snapshot is fresh again."
          done

      - name: Report unavailable Alpaca fallback
        if: steps.health.outputs.alpaca_ready == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ALPACA_STATUS: ${{ steps.health.outputs.alpaca_status }}
        run: |
          TITLE="Hourly price fallback is unavailable"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          case "$ALPACA_STATUS" in
            missing_credentials) DIAGNOSIS="The Alpaca credentials are absent from the protected github-pages environment. Add ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY there." ;;
            authentication_error) DIAGNOSIS="Alpaca rejected the configured key pair. Replace or regenerate the two Alpaca secrets." ;;
            permission_or_subscription_error) DIAGNOSIS="Alpaca accepted the request but denied the selected market-data permission or subscription. The workflow requests the free IEX feed." ;;
            rate_limited) DIAGNOSIS="Alpaca rate-limited the request. Automatic retries and Yahoo/Twelve Data failover remain active." ;;
            network_error) DIAGNOSIS="The runner could not reliably reach Alpaca. Automatic retries and provider failover remain active." ;;
            *) DIAGNOSIS="Alpaca returned no usable prices. Review the provider response in this run." ;;
          esac
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Alpaca supplied zero prices. Diagnosis: ${DIAGNOSIS} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$TITLE" --body "Alpaca supplied zero prices. Diagnosis: ${DIAGNOSIS} Yahoo remains the full-universe fallback, followed by the bounded Twelve Data fallback. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Close recovered Alpaca fallback issue
        if: steps.health.outputs.alpaca_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Hourly price fallback is unavailable"
          gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | \
          while read -r ISSUE_NUMBER; do
            [ -z "$ISSUE_NUMBER" ] || gh issue close "$ISSUE_NUMBER" --comment "Alpaca is supplying prices again."
          done

      - name: Report incomplete purchased-stock coverage
        if: steps.coverage.outputs.complete == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING_COUNT: ${{ steps.coverage.outputs.missing_count }}
          MISSING_SYMBOLS: ${{ steps.coverage.outputs.missing_symbols }}
        run: |
          TITLE="Hourly prices missing purchased stocks"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          BODY="${MISSING_COUNT} purchased symbols were not refreshed: ${MISSING_SYMBOLS}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1

      - name: Close recovered coverage issue
        if: steps.coverage.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Hourly prices missing purchased stocks"
          gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | \
          while read -r ISSUE_NUMBER; do
            [ -z "$ISSUE_NUMBER" ] || gh issue close "$ISSUE_NUMBER" --comment "All purchased symbols refreshed successfully."
          done

      - name: Finish collection slot
        if: success() && steps.lease.outputs.acquired == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m stockscanner.price_run_state finish \
            --slot "${{ steps.window.outputs.slot }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --status completed

      - name: Release failed collection slot
        if: failure() && steps.lease.outputs.acquired == 'true'
        env:
          SUPABASE_URL: https://cszzbkssxxgwgafwuonc.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m stockscanner.price_run_state finish \
            --slot "${{ steps.window.outputs.slot }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --status failed
