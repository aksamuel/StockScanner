# Stock Scanner CI Workflow
# Runs the stock scanner on a schedule (daily at market close) or on-demand.

name: Stock Scanner

on:
  # Manual trigger with configurable inputs
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        type: choice
        options:
          - watchlist
          - universe
        default: watchlist
      limit:
        description: "Max number of tickers to scan (universe mode)"
        type: number
        default: 1000
      workers:
        description: "Number of parallel workers"
        type: number
        default: 20

  # Daily at 1:00 PM UTC (9:00 AM ET, before US market open)
  schedule:
    - cron: "0 13 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run scanner (universe mode)
        if: inputs.mode == 'universe'
        run: |
          python -m stockscanner.cli \
            --universe \
            --limit ${{ inputs.limit }} \
            --parallel \
            --workers ${{ inputs.workers }}

      - name: Run scanner (watchlist mode)
        if: inputs.mode != 'universe'
        run: python -m stockscanner.cli

      - name: Upload reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scan-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Email report
        if: success()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python -c "
          import smtplib, os, glob
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders

          gmail_address = os.environ.get('GMAIL_ADDRESS', '').strip()
          gmail_password = os.environ.get('GMAIL_APP_PASSWORD', '').strip()

          if not gmail_address or not gmail_password:
              print('Gmail credentials not configured; skipping email report.')
              raise SystemExit(0)

          msg = MIMEMultipart()
          msg['From'] = gmail_address
          msg['To'] = 'aaksamuel@gmail.com'
          msg['Subject'] = 'StockScanner Report'
          msg.attach(MIMEText('StockScanner scan completed. See attached Excel report.'))

          for f in glob.glob('reports/**/*.xlsx', recursive=True):
              with open(f, 'rb') as fp:
                  part = MIMEBase('application', 'octet-stream')
                  part.set_payload(fp.read())
                  encoders.encode_base64(part)
                  part.add_header('Content-Disposition', f'attachment; filename={os.path.basename(f)}')
                  msg.attach(part)

          with smtplib.SMTP('smtp.gmail.com', 587) as server:
              server.starttls()
              server.login(gmail_address, gmail_password)
              server.send_message(msg)
          print('Email sent successfully')
          "
