# Stock Scanner CI Workflow
# Runs the stock scanner on a schedule (daily at market close) or on-demand.

name: Stock Scanner

on:
  # Manual trigger with configurable inputs
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        type: choice
        options:
          - watchlist
          - universe
        default: watchlist
      limit:
        description: "Max number of tickers to scan (universe mode)"
        type: number
        default: 1000
      workers:
        description: "Number of parallel workers"
        type: number
        default: 20

  # Daily at 1:00 PM UTC (9:00 AM ET, before US market open)
  schedule:
    - cron: "0 13 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run scanner (universe mode)
        if: github.event.inputs.mode == 'universe'
        run: |
          python -m stockscanner.cli \
            --universe \
            --limit ${{ github.event.inputs.limit }} \
            --parallel \
            --workers ${{ github.event.inputs.workers }}

      - name: Run scanner (watchlist mode)
        if: github.event.inputs.mode != 'universe'
        run: python -m stockscanner.cli

      - name: Upload reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scan-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Deploy reports to GitHub Pages
        if: ${{ always() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          publish_commit_message: "Deploy StockScanner reports to GitHub Pages"
          allow_empty_commit: true
