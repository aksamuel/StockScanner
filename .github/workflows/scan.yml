# Stock Scanner CI Workflow
# Runs the stock scanner on a schedule (daily at market close) or on-demand.

name: Stock Scanner

on:
  # Manual trigger with configurable inputs
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        type: choice
        options:
          - watchlist
          - universe
        default: watchlist
      limit:
        description: "Max number of tickers to scan (universe mode)"
        type: string
        default: "1000"
      workers:
        description: "Number of parallel workers"
        type: string
        default: "20"

  # Daily at 1:00 PM UTC (9:00 AM ET, before US market open)
  schedule:
    - cron: "0 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run scanner (universe mode)
        if: github.event.inputs.mode == 'universe'
        run: |
          python -m stockscanner.cli \
            --universe \
            --limit ${{ github.event.inputs.limit }} \
            --parallel \
            --workers ${{ github.event.inputs.workers }}

      - name: Run scanner (watchlist mode)
        if: github.event.inputs.mode != 'universe'
        run: python -m stockscanner.cli

      - name: Ensure Pages landing files exist
        if: ${{ always() }}
        run: |
          touch .nojekyll
          touch reports/.nojekyll
          if [ ! -f index.html ]; then
            cat <<'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=reports/index.html">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>StockScanner Reports</title>
          </head>
          <body>
              <p>Redirecting to <a href="reports/index.html">reports/index.html</a>...</p>
          </body>
          </html>
          EOF
          fi

      - name: Commit generated report pages
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update published stock scanner reports"
            git push
          fi

      - name: Upload reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scan-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Configure Pages
        if: ${{ always() }}
        uses: actions/configure-pages@v3

      - name: Upload reports artifact for Pages
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
