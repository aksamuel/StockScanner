# Stock Scanner CI Workflow — v2.9.1
# Runs the stock scanner at 9:00 AM New York time on NYSE trading days (Mon-Fri)
# or on-demand via the GitHub mobile app / Actions tab.
# Generates an HTML dashboard and deploys it to GitHub Pages.

name: Stock Scanner
run-name: >-
  Stock Scanner (${{ github.event_name == 'workflow_dispatch'
    && 'manual Yahoo refresh' || 'scheduled scan' }})

on:
  # Manual server-side Yahoo refresh from the Actions page.
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        type: choice
        options:
          - watchlist
          - universe
        default: universe
      limit:
        description: "Max number of tickers to scan (universe mode, 0 = all)"
        type: string
        default: "0"
      workers:
        description: "Number of parallel workers"
        type: string
        default: "20"
      portfolio:
        description: "Total portfolio value in dollars"
        type: string
        default: "50000"
      position_size:
        description: "Max % of portfolio per position"
        type: string
        default: "5"
      risk:
        description: "Risk % per trade"
        type: string
        default: "1"

  # 9:00 AM New York time on NYSE trading days (Mon-Fri)
  # 13:00 UTC = 9:00 AM EDT (summer), 8:00 AM EST (winter)
  schedule:
    - cron: "0 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run scanner (universe mode)
        if: github.event.inputs.mode == 'universe' || github.event_name == 'schedule'
        run: |
          LIMIT_FLAG=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ inputs.limit }}"
          fi
          python -m stockscanner.cli \
            --universe \
            --force-download \
            --parallel \
            --workers ${{ inputs.workers || 20 }} \
            --portfolio ${{ inputs.portfolio || 50000 }} \
            --position-size ${{ inputs.position_size || 5 }} \
            --risk ${{ inputs.risk || 1 }} \
            --html \
            --quiet \
            $LIMIT_FLAG

      - name: Run scanner (watchlist mode)
        if: github.event.inputs.mode == 'watchlist' && github.event_name != 'schedule'
        run: |
          python -m stockscanner.cli \
            --parallel \
            --workers ${{ inputs.workers || 20 }} \
            --portfolio ${{ inputs.portfolio || 50000 }} \
            --position-size ${{ inputs.position_size || 5 }} \
            --risk ${{ inputs.risk || 1 }} \
            --html \
            --quiet

      - name: Deploy Dashboard as landing page
        if: ${{ always() }}
        run: |
          python -m stockscanner.exceptions_dashboard
          touch .nojekyll
          touch reports/.nojekyll
          # Publish the latest linked report pages at stable site paths
          LATEST_LANDING=$(find reports/ -name "landing.html" -type f | sort -r | head -1)
          if [ -n "$LATEST_LANDING" ]; then
            LATEST_FOLDER=$(dirname "$LATEST_LANDING")
            cp "$LATEST_FOLDER/landing.html" index.html
            cp "$LATEST_FOLDER/technical.html" technical.html
            cp "$LATEST_FOLDER/analysts.html" analysts.html
            cp "$LATEST_FOLDER/bought-selection.html" bought-selection.html
            echo "Deployed linked dashboards from: $LATEST_FOLDER"
          else
            cat <<'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=reports/index.html">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>StockScanner Reports</title>
          </head>
          <body>
              <p>Redirecting to <a href="reports/index.html">reports/index.html</a>...</p>
          </body>
          </html>
          EOF
          fi

      - name: Commit generated report pages
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html technical.html analysts.html bought-selection.html exceptions.html prices.json .nojekyll reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update published stock scanner reports"
            git push
          fi

      - name: Upload reports artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scan-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Configure Pages
        if: ${{ always() }}
        uses: actions/configure-pages@v3

      - name: Upload reports artifact for Pages
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
