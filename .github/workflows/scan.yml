# Stock Scanner CI Workflow
# Daily seed loads the NYSE universe; hourly collection resumes the active slot and only retries missing tickers.

name: Stock Scanner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options:
          - daily-seed
          - hourly-collection
          - watchlist
          - universe
        default: watchlist
      limit:
        description: "Max number of tickers to scan (universe mode)"
        type: number
        default: 1000
      workers:
        description: "Number of parallel workers"
        type: number
        default: 20

  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "*/15 * * * 1-5"

jobs:
  daily-seed:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily-seed') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 13 * * 1-5')
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run daily universe seed
        run: python -m stockscanner.cli --daily-seed

  hourly-collection:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'hourly-collection') ||
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * 1-5')
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Resume hourly collection for missing tickers
        run: python -m stockscanner.cli --hourly-collection --batch-size 25

  scan:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'watchlist' || inputs.mode == 'universe')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run scanner (universe mode)
        if: inputs.mode == 'universe'
        run: |
          python -m stockscanner.cli \
            --universe \
            --limit ${{ inputs.limit }} \
            --parallel \
            --workers ${{ inputs.workers }}

      - name: Run scanner (watchlist mode)
        if: inputs.mode != 'universe'
        run: python -m stockscanner.cli

      - name: Upload reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scan-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
