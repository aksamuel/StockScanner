<!doctype html>
<html lang="en" data-admin-only>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>User management | StockScanner</title>
  <style data-stockscanner-auth>
    html:not(.auth-ready) { visibility: hidden; }
    .stockscanner-account { position: fixed; top: 10px; right: 12px; z-index: 99999; display: flex; gap: 10px; align-items: center; padding: 7px 10px; border: 1px solid #546e7a; border-radius: 6px; color: #eceff1; background: #10212d; font: 13px/1.2 sans-serif; }
    .stockscanner-account a { color: #81d4fa; }
    .stockscanner-account button { padding: 4px 8px; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 78px 24px 40px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e0e0e0; background: #0f1923; }
    main { width: min(100%, 1100px); margin: auto; }
    h1 { margin-bottom: 5px; color: #4fc3f7; }
    .subtitle { margin-top: 0; color: #90a4ae; }
    .page-header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
    .page-header a { padding: 10px 14px; border: 1px solid #4fc3f7; border-radius: 6px; color: #4fc3f7; text-decoration: none; font-weight: 700; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 24px 0 16px; }
    input { min-width: min(100%, 320px); padding: 10px 12px; border: 1px solid #3b5368; border-radius: 6px; color: #fff; background: #10212d; font: inherit; }
    .table-wrap { overflow-x: auto; border: 1px solid #334b5f; border-radius: 9px; }
    table { width: 100%; border-collapse: collapse; background: #1a2a3a; }
    th, td { padding: 12px; border-bottom: 1px solid #334b5f; text-align: left; white-space: nowrap; }
    th { color: #b3e5fc; background: #142433; }
    tr:last-child td { border-bottom: 0; }
    .status { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: .8rem; font-weight: 700; }
    .approved { color: #b9f6ca; background: #1b5e204f; }
    .pending { color: #ffe0b2; background: #e651004f; }
    .blocked { color: #ffcdd2; background: #b71c1c4f; }
    .actions { display: flex; gap: 7px; }
    button { padding: 7px 11px; border: 1px solid transparent; border-radius: 5px; color: #10242d; background: #81c784; font-weight: 700; cursor: pointer; }
    button.block { color: #fff; background: #ef6c00; }
    button.delete { color: #fff; background: #c62828; }
    button.refresh { color: #4fc3f7; border-color: #4fc3f7; background: transparent; }
    button:disabled { opacity: .55; cursor: wait; }
    #message { min-height: 24px; color: #ffcc80; }
    @media (max-width: 720px) { body { padding-inline: 14px; } .stockscanner-account span { display: none; } }
  </style>
</head>
<body>
  <main>
    <div class="page-header">
      <div>
        <h1>User management</h1>
        <p class="subtitle">Accept, block, or permanently delete StockScanner accounts.</p>
      </div>
      <a href="/StockScanner/admin.html">Admin dashboard</a>
    </div>
    <div class="toolbar">
      <label for="search">Search users</label>
      <input id="search" type="search" placeholder="Email address">
      <button id="refresh" class="refresh" type="button">Refresh</button>
    </div>
    <p id="message" role="status" aria-live="polite">Loading users…</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Email</th><th>Status</th><th>Created</th><th>Last sign-in</th><th>Actions</th></tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="/StockScanner/auth.js" data-stockscanner-auth></script>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/+esm";

    const ADMIN_EMAIL = "aaksamuel@zohomail.com";
    const supabase = createClient(
      "https://cszzbkssxxgwgafwuonc.supabase.co",
      "sb_publishable_VnhkG4H4acjm2Hp1k5tzyw_I9xtUrGI",
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } },
    );
    const body = document.querySelector("#users");
    const message = document.querySelector("#message");
    const search = document.querySelector("#search");
    const refresh = document.querySelector("#refresh");
    let users = [];

    const { data: { user } } = await supabase.auth.getUser();
    if (!user || (user.email || "").toLowerCase() !== ADMIN_EMAIL) {
      window.location.replace("/StockScanner/index.html");
    } else {
      await loadUsers();
    }

    refresh.addEventListener("click", loadUsers);
    search.addEventListener("input", renderUsers);

    async function loadUsers() {
      setBusy(true);
      message.textContent = "Loading users…";
      const { data, error } = await supabase.functions.invoke("manage-user", {
        body: { action: "list" },
      });
      setBusy(false);
      if (error || !data?.users) {
        message.textContent = error?.message || data?.error || "Unable to load users.";
        return;
      }
      users = data.users;
      message.textContent = `${users.length} registered user${users.length === 1 ? "" : "s"}.`;
      renderUsers();
    }

    function renderUsers() {
      const term = search.value.trim().toLowerCase();
      const visible = users.filter((item) => item.email.toLowerCase().includes(term));
      body.replaceChildren(...visible.map(userRow));
      if (!visible.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 5;
        cell.textContent = "No matching users.";
        row.append(cell);
        body.append(row);
      }
    }

    function userRow(item) {
      const row = document.createElement("tr");
      const email = document.createElement("td");
      email.textContent = item.email;
      const statusCell = document.createElement("td");
      const status = document.createElement("span");
      status.className = `status ${item.status}`;
      status.textContent = item.status[0].toUpperCase() + item.status.slice(1);
      statusCell.append(status);
      const created = document.createElement("td");
      created.textContent = formatTime(item.created_at);
      const signedIn = document.createElement("td");
      signedIn.textContent = formatTime(item.last_sign_in_at);
      const actions = document.createElement("td");
      actions.className = "actions";

      if (item.email.toLowerCase() === ADMIN_EMAIL) {
        actions.textContent = "Protected administrator";
      } else {
        if (item.status !== "approved") actions.append(actionButton("Accept", "accept", item));
        if (item.status !== "blocked") actions.append(actionButton("Block", "block", item, "block"));
        actions.append(actionButton("Delete", "delete", item, "delete"));
      }
      row.append(email, statusCell, created, signedIn, actions);
      return row;
    }

    function actionButton(label, action, item, className = "") {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.className = className;
      button.addEventListener("click", async () => {
        if (action === "delete" && !window.confirm(`Permanently delete ${item.email}? This cannot be undone.`)) return;
        setBusy(true);
        const progress = { accept: "Accepting", block: "Blocking", delete: "Deleting" }[action];
        message.textContent = `${progress} ${item.email}…`;
        const { data, error } = await supabase.functions.invoke("manage-user", {
          body: { action, user_id: item.id },
        });
        if (error || data?.error) {
          setBusy(false);
          message.textContent = error?.message || data?.error || "The user action failed.";
          return;
        }
        message.textContent = data.message;
        await loadUsers();
      });
      return button;
    }

    function setBusy(busy) {
      for (const button of document.querySelectorAll("button")) button.disabled = busy;
    }

    function formatTime(value) {
      return value ? new Date(value).toLocaleString() : "Never";
    }
  </script>
</body>
</html>
